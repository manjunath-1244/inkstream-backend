apiVersion: v1
kind: Secret
metadata:
  name: inkstream-backend-secrets
  labels:
    app: inkstream-backend
type: Opaque
data:
  # NOTE: All secret values MUST be Base64-encoded.
  # These are pre-encoded local development default values for your convenience.
  # WARNING: Regenerate and replace these base64 secrets for actual production environment!
  
  # DB Credentials ("postgres" in plain text)
  DB_USER: cG9zdGdyZXM=
  DB_PASSWORD: cG9zdGdyZXM=
  
  # JWT Credentials
  # "your_super_secret_access_key" in plain text
  JWT_ACCESS_SECRET: eW91cl9zdXBlcl9zZWNyZXRfYWNjZXNzX2tleQ==
  # "your_super_secret_refresh_key" in plain text
  JWT_REFRESH_SECRET: eW91cl9zdXBlcl9zZWNyZXRfcmVmcmVzaF9rZXk=
  
  # MinIO / S3 Credentials ("minioadmin" in plain text)
  S3_ACCESS_KEY: bWluaW9hZG1pbg==
  S3_SECRET_KEY: bWluaW9hZG1pbg==
