name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  docker-publish:
    name: Build & Publish Production Docker Image
    needs: validate
    runs-on: ubuntu-latest
    # Only run this job if a new version tag (e.g. v1.0.0) is pushed to main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: actions/setup-qemu@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx@v3

      # --- CONFIGURATION FOR GITHUB CONTAINER REGISTRY (GHCR) ---
      # Free, secure, and requires zero manual secret setup!
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # This automatically tags your image as: ghcr.io/username/repository:v1.x.x AND latest
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build and Push production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- ALTERNATIVE CONFIGURATION FOR DOCKER HUB ---
      # If you prefer to push to Docker Hub instead, uncomment the section below,
      # comment out the GHCR section above, and add your DOCKER_USERNAME and DOCKER_PASSWORD
      # inside your GitHub repository settings under Settings -> Secrets -> Actions.
      #
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #
      # - name: Extract Docker Hub Metadata
      #   id: dockerhub_meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: ${{ secrets.DOCKER_USERNAME }}/inkstream-backend
      #     tags: |
      #       type=semver,pattern={{version}}
      #       type=raw,value=latest
      #
      # - name: Build and Push to Docker Hub
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: ./Dockerfile
      #     push: true
      #     tags: ${{ id.dockerhub_meta.outputs.tags }}
      #     labels: ${{ id.dockerhub_meta.outputs.labels }}
